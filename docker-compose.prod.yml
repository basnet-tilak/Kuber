version: '3.8'

services:
  kuber-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - kuber-db-prod
      - kuber-redis-prod
      - kuber-kafka-prod
    networks:
      - kuber-prod-network

  kuber-db-prod:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: kuber_production
      MYSQL_USER: kuber_prod_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - kuber_db_prod_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - kuber-prod-network
    command: --default-authentication-plugin=mysql_native_password --ssl-mode=REQUIRED

  kuber-redis-prod:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - kuber_redis_prod_data:/data
    ports:
      - "6379:6379"
    networks:
      - kuber-prod-network

  kuber-kafka-prod:
    image: confluentinc/cp-kafka:latest
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: kuber-zookeeper-prod:2181
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kuber-kafka-prod:9092
      KAFKA_SECURITY_INTER_BROKER_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
    volumes:
      - ./kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf
    depends_on:
      - kuber-zookeeper-prod
    ports:
      - "9092:9092"
    networks:
      - kuber-prod-network

  kuber-zookeeper-prod:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - kuber-prod-network

volumes:
  kuber_db_prod_data:
  kuber_redis_prod_data:

networks:
  kuber-prod-network:
    driver: bridge