spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://kuber-db-prod:3306/kuber_production?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
    username: kuber_prod_user
    password: ${DB_PASSWORD:Kub3r_Pr0d_2024!@#$%^&*()}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      
  data:
    redis:
      url: redis://:${REDIS_PASSWORD:R3d1s_Pr0d_2024!@#$%}@kuber-redis-prod:6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 5
          
  kafka:
    bootstrap-servers: kuber-kafka-prod:9092
    security:
      protocol: SASL_SSL
    sasl:
      mechanism: PLAIN
      jaas:
        config: org.apache.kafka.common.security.plain.PlainLoginModule required username="kuber_kafka_user" password="${KAFKA_PASSWORD:K4fk4_Pr0d_2024!@#$%}";
    producer:
      batch-size: 16384
      linger: 5ms
      buffer-memory: 33554432
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: kuber-trading
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        connection:
          provider_disables_autocommit: true
    show-sql: false
    
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    
  cache:
    type: redis
    redis:
      time-to-live: 600000

# Security Configuration
security:
  jwt:
    secret: ${JWT_SECRET:Jwt_S3cr3t_K3y_2024!@#$%^&*()_V3ry_L0ng_4nd_S3cur3}
    expiration: ${JWT_EXPIRATION:86400}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}

# Management and Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
  security:
    enabled: true

# Server Configuration
server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Logging Configuration
logging:
  level:
    com.kuber: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/kuber/application.log
    max-size: 100MB
    max-history: 30